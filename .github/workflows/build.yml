name: Build Hulk Native PC v0.4

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Configure Visual Studio C++ & Clang environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    - name: Run Windows Build Script
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $projectDir = "$PWD/Hulk_NativePC_Source_v0.4_NativeBridge"
        if (!(Test-Path $projectDir)) {
            $projectDir = "$PWD" # Если файлы распакованы прямо в корень
        }
        
        Set-Location $projectDir
        if (Test-Path "BUILD_WINDOWS.ps1") {
            ./BUILD_WINDOWS.ps1
        } else {
            throw "BUILD_WINDOWS.ps1 not found in $projectDir"
        }

    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Hulk-NativePC-Release-v0.4
        path: |
          **/out/HULK_NATIVE_PC_TEST/**/*
          **/out/**/*.exe
          **/out/**/*.dll
