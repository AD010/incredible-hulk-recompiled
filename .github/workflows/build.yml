name: Build Hulk Native PC v0.4

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Download ReXGlue SDK Manually
      run: |
        if (!(Test-Path "thirdparty/rexglue-sdk")) {
            mkdir thirdparty -Force
            git clone https://github.com/rexglue/rexglue-sdk.git thirdparty/rexglue-sdk
        }

    - name: Configure CMake
      run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DREXSDK_DIR="${{ github.workspace }}/thirdparty/rexglue-sdk"

    - name: Build Project
      run: cmake --build build --config Release --parallel

    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Hulk-NativePC-Release-v0.4
        path: |
          build/Release/*.exe
          build/Release/*.dll
          build/**/*.exe
          build/**/*.dll
          *.toml
          build/Release/*.dll
          build/**/*.exe
          build/**/*.dll
          *.toml
