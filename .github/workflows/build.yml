name: Build Hulk Native PC v0.4

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install LLVM/Clang
      run: |
        winget install --id LLVM.LLVM --silent --accept-package-agreements --accept-source-agreements
        echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

    - name: Download ReXGlue SDK Manually
      run: |
        if (!(Test-Path "thirdparty/rexglue-sdk")) {
            mkdir thirdparty -Force
            git clone https://github.com/rexglue/rexglue-sdk.git thirdparty/rexglue-sdk
        }

    - name: Configure CMake with Ninja
      run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DREXSDK_DIR="${{ github.workspace }}/thirdparty/rexglue-sdk"

    - name: Build Project
      run: cmake --build build --parallel

    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Hulk-NativePC-Release-v0.4
        path: |
          build/**/*.exe
          build/**/*.dll
          *.toml
